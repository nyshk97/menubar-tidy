name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # MACOSX_DEPLOYMENT_TARGET is 26.0, so this needs the macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild test \
            -project Thaw.xcodeproj \
            -scheme Thaw \
            -configuration Debug \
            -derivedDataPath Build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify the SwiftLint input list is current
        run: |
          set -euo pipefail
          scripts/generate-swiftlint-inputs.sh /tmp/swiftlint-inputs.xcfilelist
          diff -u scripts/swiftlint-inputs.xcfilelist /tmp/swiftlint-inputs.xcfilelist
