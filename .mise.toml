[tools]
swiftformat = "0.62.1"
swiftlint = "0.65.0"

[env]
PROJECT = "Thaw.xcodeproj"
SCHEME = "Thaw"
CONFIGURATION = "Debug"
DERIVED_DATA = "Build"
# Debug ビルドは dev 版として別アプリになる（名前・バンドルID・アイコンが別）。
# タスクはすべて dev 版を相手にする。常用版は brew で入れた MenuBar Tidy.app。
APP = "Build/Build/Products/Debug/MenuBarTidy-dev.app"
BUNDLE_ID = "com.nyshk97.MenuBarTidy.dev"
SUPPORT_DIR_NAME = "MenuBarTidy-dev"
# 整形の対象。Build/ 配下には SwiftPM の checkout（他人のコード）が入るので、
# `swiftformat .` にはしない。
SOURCES = "Thaw ThawTests"

# --- 開発機のセットアップ -------------------------------------------------

[tasks.doctor]
description = "この Mac で開発・リリースに必要なものが揃っているか確認する"
# 証明書も notarize の資格情報も keychain にあり、リポジトリには入らない。
# 開発機を移したとき欠けるのはここだけなので、まとめて見えるようにしておく。
shell = "bash -c"
run = '''
set -uo pipefail
TEAM_ID="VYDUR99LAM"
PROFILE="${NOTARY_PROFILE:-nyshk97-notary}"
status=0
ok() { printf '  OK  %s\n' "$1"; }
ng() { printf '  NG  %s\n      → %s\n' "$1" "$2"; status=1; }
IDS="$(security find-identity -v -p codesigning 2>/dev/null || true)"

echo "== 開発（Debug ビルド・テスト）=="
if command -v xcodebuild > /dev/null 2>&1; then
    ok "$(xcodebuild -version | head -1)"
else
    ng "Xcode がない" "Xcode 26 以上を入れて xcode-select -s で選ぶ"
fi
for tool in swiftformat swiftlint; do
    if command -v "$tool" > /dev/null 2>&1; then
        ok "$tool $("$tool" --version 2>/dev/null | tail -1)"
    else
        ng "$tool がない" "mise install"
    fi
done
case "$IDS" in
    *"Apple Development"*) ok "Apple Development 証明書（Debug の署名）" ;;
    *) ng "Apple Development 証明書がない" "Xcode → Settings → Accounts でサインインする" ;;
esac

echo "== リリース =="
case "$IDS" in
    *"Developer ID Application"*"($TEAM_ID)"*) ok "Developer ID Application 証明書（${TEAM_ID}）" ;;
    *) ng "Developer ID Application 証明書（${TEAM_ID}）がない" \
          "Xcode → Settings → Accounts → Manage Certificates から取得する" ;;
esac
if xcrun notarytool history --keychain-profile "$PROFILE" > /dev/null 2>&1; then
    ok "notarytool の keychain プロファイル '$PROFILE'"
else
    ng "notarytool の keychain プロファイル '$PROFILE' が無い/使えない" \
       "自分の Terminal で確認 → 無ければ xcrun notarytool store-credentials $PROFILE --key ~/Library/CloudStorage/Dropbox/secrets/AuthKey_M4FG2B8JFX.p8 --key-id M4FG2B8JFX --issuer 024fc873-10f9-49a4-8d6f-20fb5c7bd522"
fi
if gh auth status > /dev/null 2>&1; then
    ok "gh 認証済み（GitHub Release と homebrew-tap の更新に使う）"
else
    ng "gh が未認証" "gh auth login"
fi
if security find-generic-password -s "https://sparkle-project.org" -a menubar-tidy > /dev/null 2>&1; then
    ok "Sparkle の EdDSA 秘密鍵（keychain account 'menubar-tidy'）"
else
    ng "Sparkle の EdDSA 秘密鍵（keychain account 'menubar-tidy'）が無い" \
       "自分の Terminal で Build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys --account menubar-tidy -f ~/Library/CloudStorage/Dropbox/secrets/sparkle-ed25519-menubar-tidy-private.key（バックアップから復元。sign_update は xcodebuild -resolvePackageDependencies で落ちる）"
fi

exit "$status"
'''

# --- ビルドと実行 ---------------------------------------------------------

[tasks.build]
description = "Debug ビルド"
run = '''
set -uo pipefail
xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
    -configuration "$CONFIGURATION" -derivedDataPath "$DERIVED_DATA" build
'''

[tasks.run]
description = "ビルドして起動する（起動中のものは先に終了）"
depends = ["kill", "build"]
run = 'open "$APP"'

[tasks.kill]
description = "ビルド済みアプリとテストホストの常駐を止める"
# パターンは作業ツリーの絶対パスと $APP から組む。チェックアウト名やアプリ名を
# 決め打ちすると、別のパスに clone した開発機や PRODUCT_NAME を変えた後に何も
# 止まらず、しかも成功したように見える（実際 dev 版へのリネーム後、"MenuBar Tidy"
# 決め打ちのままで dev 版が止まらず常用版と同時起動になった）。
# インストール済みの /Applications 版を巻き込まないためにパスで絞るのは維持する。
run = 'pkill -f "${MISE_PROJECT_ROOT:-$PWD}/$APP/" || true'

[tasks.clean]
description = "ビルド成果物を捨てる"
run = 'rm -rf "$DERIVED_DATA" 2>/dev/null || true'

# --- テスト ---------------------------------------------------------------

[tasks.test]
description = "テストを実行する（終了時に UserDefaults の汚染を自動で後始末）"
# PIPESTATUS を使うので既定の sh ではなく bash で走らせる。
shell = "bash -c"
run = '''
set -uo pipefail

# 同じ derivedDataPath を指す xcodebuild が2本走ると、テストホストが成果物と
# UserDefaults を奪い合って途中で打ち切られる。コードの問題と見分けがつかない。
# macOS の pgrep に -c は無いので、終了コードで判定する。
if pgrep -x xcodebuild > /dev/null; then
    echo "error: xcodebuild が既に走っている。終わるまで待つこと（VERIFY.md §2）" >&2
    exit 1
fi

trap 'mise run test:cleanup' EXIT

# -destination は付けない。付けるとテスト対象が一部（557 件）に絞られて
# TEST FAILED になる。CI が付けているのは runner 側の事情。
xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
    -configuration "$CONFIGURATION" -derivedDataPath "$DERIVED_DATA" test 2>&1 \
    | grep -E "✘|error:|Test run with|TEST (SUCCEEDED|FAILED)"
status=${PIPESTATUS[0]}

# 「Executed 0 tests」は XCTest 側のカウントで無視してよい。実数は
# 「Test run with N tests」の行に出る（このプロジェクトは swift-testing）。
exit "$status"
'''

[tasks."test:cleanup"]
description = "テストが残す常駐プロセスと UserDefaults の汚染を掃除する"
run = '''
set -uo pipefail

pkill -f "${MISE_PROJECT_ROOT:-$PWD}/$APP/" || true

# ShowOnHover の既定は false。1 が読めたらテストの書き込みが実ドメインに
# 落ちている（アイコンが潰れる・空欄クリックが効かない等の原因になる）。
if [ "$(defaults read "$BUNDLE_ID" ShowOnHover 2>/dev/null || echo 0)" = "1" ]; then
    echo "UserDefaults が汚染されている。退避して削除する。"
    defaults export "$BUNDLE_ID" /tmp/thaw-domain-backup.plist
    defaults delete "$BUNDLE_ID"
    echo "退避先: /tmp/thaw-domain-backup.plist"
else
    echo "UserDefaults の汚染なし。"
fi
'''

# --- 静的検査 -------------------------------------------------------------

[tasks.lint]
description = "SwiftLint を回す"
run = "swiftlint lint --quiet"

[tasks."lint:fix"]
description = "SwiftLint の自動修正をかける"
run = "swiftlint lint --fix"

[tasks.format]
description = "SwiftFormat で整形する"
run = "swiftformat $SOURCES"

[tasks."format:check"]
description = "SwiftFormat の差分だけ見る（書き換えない）"
run = "swiftformat $SOURCES --lint"

[tasks."lint:inputs"]
description = "SwiftLint の入力ファイルリストを再生成する"
run = "scripts/generate-swiftlint-inputs.sh"

[tasks."lint:inputs:verify"]
description = "入力ファイルリストが最新か確認する（CI と同じ検査）"
run = '''
set -euo pipefail
scripts/generate-swiftlint-inputs.sh /tmp/swiftlint-inputs.xcfilelist
diff -u scripts/swiftlint-inputs.xcfilelist /tmp/swiftlint-inputs.xcfilelist
echo "入力リストは最新。"
'''

[tasks.check]
description = "整形・lint・入力リストの鮮度をまとめて確認する（書き換えない）"
depends = ["format:check", "lint", "lint:inputs:verify"]

[tasks.strings]
description = "UI 文字列に英語が紛れ込んでいないか走査する（このアプリは日本語直書き）"
run = '''
set -uo pipefail

echo "== 英語リテラルの疑い（macOS ... で始まる行は日本語文中の英単語で正常）=="
grep -rnE '(Text|Label|Button|Toggle)\(\s*"[A-Za-z]|withTitle: "[A-Za-z]|\btitle: "[A-Za-z]|(messageText|informativeText)\s*=\s*"[A-Za-z]' --include="*.swift" Thaw \
    | grep -vE 'MenuBarItemTag|iconName|systemSymbolName|accessibilityDescription' || echo "（なし）"

echo
echo "== ローカライズ API の復活（0 件が正）=="
grep -rn "String(localized\|LocalizedStringKey" --include="*.swift" Thaw || echo "（なし）"
'''

# --- 実機での確認 ---------------------------------------------------------

[tasks.preview]
description = "一覧メニューの中身（区分・表示名）を、アプリを起動せずに出す（本体のソースを署名なしでビルドして動かす）"
usage = 'arg "[args]" var=#true help="--press <表示名> で、その項目を一覧から選んだときと同じ経路で押す"'
shell = "bash -c"
run = '''
set -euo pipefail
eval "set -- ${usage_args:-}"
args=()
for a in "$@"; do [ -n "$a" ] && args+=("$a"); done
OUT="${TMPDIR:-/tmp}/menubar-tidy-preview"
mkdir -p "$OUT"
swiftc -swift-version 6 -default-isolation MainActor -O \
    Thaw/Items/*.swift Thaw/Utilities/AppIdentity.swift Thaw/Utilities/Log.swift \
    scripts/menu-preview/main.swift -o "$OUT/menu-preview"
"$OUT/menu-preview" ${args[@]+"${args[@]}"}
'''

[tasks.items]
description = "メニューバーの全項目をアクセシビリティから一覧する（座標・持ち主・説明）"
run = "swift scripts/list-ax-items.swift"

[tasks.logs]
description = "最新のアプリログを追う。引数を渡すとその正規表現で絞り込む"
usage = 'arg "<pattern>" help="絞り込む正規表現" default=""'
run = '''
set -uo pipefail
log_dir="$HOME/Library/Logs/$SUPPORT_DIR_NAME"
latest="$log_dir/$(ls -t "$log_dir" 2>/dev/null | head -1)"
if [ ! -f "$latest" ]; then
    echo "error: ログがない（アプリを一度起動すること）: $log_dir" >&2
    exit 1
fi
echo "== $latest ==" >&2
if [ -z "$usage_pattern" ]; then
    tail -f "$latest"
else
    grep -iE "$usage_pattern" "$latest"
fi
'''

[tasks.info]
description = "ビルド済みバンドルの表示名と署名を確認する"
run = '''
set -uo pipefail
/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist"
/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
codesign -dvv "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier"
'''

[tasks.defaults]
description = "アプリの UserDefaults を丸ごと読む"
run = 'defaults read "$BUNDLE_ID"'

# --- リリース -------------------------------------------------------------

[tasks."release:zip"]
description = "Release ビルドを配布要件で検証して dist/ に zip を作る"
run = "scripts/make-release-zip.sh"

[tasks."release:notarize"]
description = "dist/ の zip を notarize して staple 済みに差し替える"
run = "scripts/notarize.sh"

[tasks.release]
description = "バージョンを上げてビルド・notarize・GitHub Release・cask 更新まで通す（Claude Code からも実行できる）"
usage = 'arg "<bump>" help="patch|minor|major|x.y.z" default="patch"'
run = 'scripts/release.sh "$usage_bump"'
